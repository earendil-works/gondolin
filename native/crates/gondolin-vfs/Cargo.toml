[package]
name = "gondolin-vfs"
description = "Host side of the sandboxfs RPC: mount table, native providers, object-tier cache"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gondolin-wire.workspace = true
gondolin-proto.workspace = true
tokio.workspace = true
gondolin-log.workspace = true
gondolin-virtiofs = { path = "../gondolin-virtiofs" }
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "io-std", "process"] }
tempfile = "3"
