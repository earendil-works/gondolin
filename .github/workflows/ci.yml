name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Typecheck (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported Node (package.json engines) and current CI default
        node-version: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint host
        run: make -C host lint

      - name: Typecheck host
        run: pnpm --filter @earendil-works/gondolin exec tsc --noEmit

      - name: Build package artifacts
        run: pnpm --filter @earendil-works/gondolin run build

      - name: Verify packaged CLI runtime
        run: node host/dist/bin/gondolin.js --help >/dev/null

  native:
    name: Native engine (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Check (rustfmt + clippy -D warnings)
        run: make -C native check

      # qemu-img/qemu-io for the gondolin-qcow2 interop tests (tests/qemu.rs)
      - name: Install qemu-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils

      - name: Test workspace
        working-directory: native
        env:
          # fail instead of skipping the qemu-img interop tests
          GONDOLIN_REQUIRE_QEMU_IMG: "1"
        run: cargo test --workspace --locked

      - name: Build release binaries (gondolind + static gondolin CLI)
        working-directory: native
        run: cargo build --release --locked -p gondolind -p gondolin-cli

      - name: Verify binaries
        run: |
          native/target/release/gondolind --version
          native/target/release/gondolin --version

      - name: Upload native binaries
        uses: actions/upload-artifact@v7
        with:
          name: gondolin-native-linux-x64
          path: |
            native/target/release/gondolind
            native/target/release/gondolin
          retention-days: 7

  native-deps:
    name: Native dependency budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # runtime crates of the gondolin binary per release target
      # (native/scripts/count-deps.sh, budget in native/deps-budget)
      - name: Count runtime crates
        run: make -C native deps

  build-guest:
    name: Build Guest (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            qemu: qemu-system-x86
            artifact: gondolin-guest-x64
            zig-target: x86_64-linux-musl
          - arch: aarch64
            qemu: qemu-system-arm
            artifact: gondolin-guest-arm64
            zig-target: aarch64-linux-musl
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Zig
        run: scripts/install-zig.sh 0.17.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.qemu }} lz4
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pnpm install

      - name: Build guest binaries (cross-compile)
        run: |
          cd guest
          zig build -Doptimize=ReleaseSmall -Dtarget=${{ matrix.zig-target }}

      - name: Build guest image
        run: |
          NODE_BIN="$(node -p 'process.execPath')"
          cd guest
          ALPINE_ARCH=${{ matrix.arch }} \
            GONDOLIN_SANDBOX_HELPERS_DIR="$PWD/zig-out" \
            make build NODE="$NODE_BIN"

      - name: Package assets
        run: |
          cd guest/image/out
          tar -czvf ../../../${{ matrix.artifact }}.tar.gz \
            manifest.json vmlinuz-virt initramfs.cpio.lz4 rootfs.ext4 \
            krun-kernel krun-empty-initrd

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          retention-days: 7

  container-build:
    name: Container Build (smoke)
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Zig
        run: scripts/install-zig.sh 0.17.0

      - name: Install dependencies
        run: pnpm install

      - name: Verify host CLI runtime
        run: node host/bin/gondolin.ts --help >/dev/null

      - name: Build guest binaries
        run: |
          cd guest
          zig build -Doptimize=ReleaseSmall

      - name: Verify Docker is available
        run: docker info

      - name: Smoke test container build (forces docker)
        timeout-minutes: 15
        run: |
          cat > build-config-container-smoke.json <<'JSON'
          {
            "arch": "x86_64",
            "distro": "alpine",
            "alpine": {
              "version": "3.23.0",
              "kernelPackage": "linux-virt",
              "kernelImage": "vmlinuz-virt",
              "rootfsPackages": ["linux-virt"],
              "initramfsPackages": []
            },
            "container": {
              "force": true,
              "image": "alpine:3.23",
              "runtime": "docker"
            },
            "sandboxdPath": "./guest/zig-out/bin/sandboxd",
            "sandboxfsPath": "./guest/zig-out/bin/sandboxfs",
            "sandboxsshPath": "./guest/zig-out/bin/sandboxssh",
            "sandboxingressPath": "./guest/zig-out/bin/sandboxingress"
          }
          JSON

          node host/bin/gondolin.ts build \
            --config build-config-container-smoke.json \
            --output ./tmp-container-assets \
            --quiet

          test -f ./tmp-container-assets/manifest.json
          test -s ./tmp-container-assets/vmlinuz-virt
          test -s ./tmp-container-assets/initramfs.cpio.lz4
          test -s ./tmp-container-assets/rootfs.ext4
          test -s ./tmp-container-assets/krun-kernel
          test -f ./tmp-container-assets/krun-empty-initrd

  krun-linux-build:
    name: Build krun runner (Linux x86_64 smoke)
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Zig
        run: scripts/install-zig.sh 0.17.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl git make pkg-config clang lld xz-utils \
            libclang-dev llvm-dev libcap-ng-dev

      - name: Build krun runner
        run: make krun-runner

      - name: Verify krun runner binary
        run: host/krun-runner/zig-out/bin/gondolin-krun-runner --version

  krun-runner-package-smoke:
    name: Package krun runner (Linux x86_64 smoke)
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Zig
        run: scripts/install-zig.sh 0.17.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl git make pkg-config clang lld xz-utils \
            libclang-dev llvm-dev libcap-ng-dev

      - name: Build krun runner
        run: make krun-runner

      - name: Prepare linux runner package payload
        run: |
          node scripts/prepare-krun-runner-package.mjs \
            --package packages/gondolin-krun-runner-linux-x64

      # the published runner must keep working on glibc 2.34 (Amazon Linux
      # 2023, RHEL 9): see KRUN_RUNNER_GLIBC in the Makefile
      - name: Check the runner's glibc floor
        run: |
          set -eu
          for f in packages/gondolin-krun-runner-linux-x64/bin/gondolin-krun-runner \
                   packages/gondolin-krun-runner-linux-x64/lib/libkrun.so.*.*; do
            need=$(objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
            echo "$f: glibc $need"
            if [ "$(printf '%s\n2.34\n' "$need" | sort -V | tail -1)" != 2.34 ]; then
              echo "::error::$f needs glibc $need (> 2.34)"; exit 1
            fi
          done

      - name: Smoke test packed linux runner package
        run: |
          PKG_DIR="packages/gondolin-krun-runner-linux-x64"
          PKG_TGZ=$(cd "$PKG_DIR" && npm pack --silent)
          PKG_PATH="$PWD/$PKG_DIR/$PKG_TGZ"

          TMP_DIR=$(mktemp -d)
          cd "$TMP_DIR"
          npm init -y >/dev/null
          npm install "$PKG_PATH" >/dev/null
          ./node_modules/.bin/gondolin-krun-runner --version

  backend-parity:
    name: Backend parity (qemu + krun)
    needs: [check, build-guest, krun-linux-build, krun-runner-package-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Download guest assets
        uses: actions/download-artifact@v8
        with:
          name: gondolin-guest-x64
          path: .

      - name: Extract guest assets
        run: |
          mkdir -p guest/image/out
          tar -xzvf gondolin-guest-x64.tar.gz -C guest/image/out
          touch guest/image/out/*

      - name: Install Zig
        run: scripts/install-zig.sh 0.17.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 lz4 \
            build-essential curl git make pkg-config clang lld xz-utils \
            libclang-dev llvm-dev libcap-ng-dev

      - name: Enable KVM
        run: sudo chown "$(id -u)" /dev/kvm

      - name: Install dependencies
        run: pnpm install

      - name: Build krun runner
        run: make krun-runner

      # the SDK runs VMs of both backends through gondolind; built here
      # rather than taken from the native job so this job does not depend
      # on that job's lint and dependency checks
      - name: Build gondolind
        working-directory: native
        run: |
          cargo build --release --locked -p gondolind
          echo "GONDOLIN_NATIVE_BIN=$PWD/target/release/gondolind" >> "$GITHUB_ENV"

      # x86_64 krun must work here (the runner has /dev/kvm): a failed probe
      # fails the job instead of letting the krun tests skip themselves
      - name: Probe krun runtime availability
        run: |
          cd host
          node --input-type=module -e "import { getKrunRuntimeSkipReason } from './test/helpers/vm-fixture.ts'; const reason = await getKrunRuntimeSkipReason(); if (reason) { console.log('krun precheck: unavailable ->', reason); process.exit(1); } else { console.log('krun precheck: available'); }"
        env:
          GONDOLIN_GUEST_DIR: ${{ github.workspace }}/guest/image/out

      - name: Run backend parity tests
        timeout-minutes: 15
        run: |
          cd host
          pnpm run test:backend-parity
        env:
          GONDOLIN_GUEST_DIR: ${{ github.workspace }}/guest/image/out
          WS_TIMEOUT: "120000"
          GONDOLIN_REQUIRE_KRUN: "1"

  firecracker:
    name: Firecracker backend (KVM, jailed)
    needs: [check, build-guest, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Download guest assets
        uses: actions/download-artifact@v8
        with:
          name: gondolin-guest-x64
          path: .

      - name: Extract guest assets
        run: |
          mkdir -p guest/image/out
          tar -xzvf gondolin-guest-x64.tar.gz -C guest/image/out
          # the jailed VMM (an unprivileged uid) reads the image files
          chmod -R o+rX guest/image/out

      - name: Download native binaries
        uses: actions/download-artifact@v8
        with:
          name: gondolin-native-linux-x64
          path: native-bin

      - name: Install native binaries
        run: |
          chmod +x native-bin/gondolind native-bin/gondolin
          echo "GONDOLIN_DAEMON_BIN=$PWD/native-bin/gondolind" >> "$GITHUB_ENV"

      - name: Install Firecracker and its jailer
        run: scripts/install-firecracker.sh

      - name: Install dependencies
        run: pnpm install

      # the daemon runs as root (scripts/gondolind-sudo.sh): network
      # namespaces, taps and the jailer; the tests run as the runner user
      - name: Run host tests on firecracker
        timeout-minutes: 20
        run: scripts/ci-firecracker.sh
        env:
          GONDOLIN_GUEST_DIR: ${{ github.workspace }}/guest/image/out
          WS_TIMEOUT: "120000"

  test:
    name: Test
    needs: [check, build-guest, native]
    runs-on: ubuntu-latest
    env:
      # krun is the default where a runner is installed (the npm runner
      # package is), but it is best-effort on shared runners and this job
      # covers the QEMU paths (virtio-fs, sandboxfs); see backend-parity
      GONDOLIN_VMM: qemu
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Download guest assets
        uses: actions/download-artifact@v8
        with:
          name: gondolin-guest-x64
          path: .

      - name: Extract guest assets
        run: |
          mkdir -p guest/image/out
          tar -xzvf gondolin-guest-x64.tar.gz -C guest/image/out
          # Touch extracted files so Make considers them newer than source deps
          # (prevents rebuilding images that were already built in build-guest job)
          touch guest/image/out/*

      - name: Install Zig
        run: scripts/install-zig.sh 0.17.0

      - name: Download native binaries
        uses: actions/download-artifact@v8
        with:
          name: gondolin-native-linux-x64
          path: native-bin

      - name: Install native binaries
        run: |
          chmod +x native-bin/gondolind native-bin/gondolin
          echo "GONDOLIN_NATIVE_BIN=$PWD/native-bin/gondolind" >> "$GITHUB_ENV"
          echo "GONDOLIN_CLI_BIN=$PWD/native-bin/gondolin" >> "$GITHUB_ENV"

      - name: Install system dependencies
        # Ubuntu's QEMU has vhost-user-fs and memory-backend-memfd, so the
        # guest filesystem runs over virtio-fs here.
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 lz4
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: sudo chown "$(id -u)" /dev/kvm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Run guest tests
        timeout-minutes: 10
        run: make -C guest test NODE="$(node -p 'process.execPath')"
        env:
          GONDOLIN_GUEST_DIR: ${{ github.workspace }}/guest/image/out

      - name: Check the guest mounts the VFS over virtio-fs
        timeout-minutes: 5
        working-directory: host
        run: node scripts/check-virtiofs.ts
        env:
          GONDOLIN_GUEST_DIR: ${{ github.workspace }}/guest/image/out
          GONDOLIN_VIRTIOFS: "1"

      - name: Run host tests (virtio-fs)
        timeout-minutes: 25
        run: make -C host test NODE="$(node -p 'process.execPath')"
        env:
          GONDOLIN_GUEST_DIR: ${{ github.workspace }}/guest/image/out
          WS_TIMEOUT: "120000"

      - name: Run native VFS tests over sandboxfs
        # the fallback transport (krun, QEMU without vhost-user)
        timeout-minutes: 10
        working-directory: host
        run: node --test test/vfs.test.ts test/native-vfs.test.ts test/vfs-many-mounts.test.ts
        env:
          GONDOLIN_VIRTIOFS: "0"
          GONDOLIN_GUEST_DIR: ${{ github.workspace }}/guest/image/out
          WS_TIMEOUT: "120000"

