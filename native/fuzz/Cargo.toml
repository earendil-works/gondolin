[package]
name = "gondolin-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
description = "cargo-fuzz targets for the guest-facing parsers of gondolind (nightly; not a workspace member)"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
base64 = "0.22"
bytes = "1"
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
gondolin-wire = { path = "../crates/gondolin-wire" }
gondolin-proto = { path = "../crates/gondolin-proto" }
gondolin-netstack = { path = "../crates/gondolin-netstack" }
gondolin-egress = { path = "../crates/gondolin-egress" }
gondolin-http = { path = "../crates/gondolin-http" }
url = "2"
gondolin-sshproxy = { path = "../crates/gondolin-sshproxy" }
gondolind = { path = "../crates/gondolind" }
gondolin-assets = { path = "../crates/gondolin-assets" }
gondolin-hooks-djs = { path = "../crates/gondolin-hooks-djs" }
gondolin-qcow2 = { path = "../crates/gondolin-qcow2" }
miniz_oxide = "0.9"

# standalone: not part of the native/ workspace (needs nightly + cargo-fuzz)
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "netstack_parse"
path = "fuzz_targets/netstack_parse.rs"
test = false
doc = false
bench = false

