[package]
name = "gondolin-assets"
description = "Guest image resolution, registry and on-disk cache for gondolind (shared with the node engine)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gondolin-log.workspace = true
gondolin-wire.workspace = true
tokio = { workspace = true, features = ["fs"] }
miniz_oxide = "0.9"
bytes.workspace = true
gondolin-http.workspace = true
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
# builds and inspects JSON documents in tests
serde_json = "1"
tokio = { workspace = true, features = ["macros", "rt", "io-std", "process"] }
tempfile = "3"
# reference writer for archives in tests
flate2 = "1"
tar = { version = "0.4", default-features = false }
