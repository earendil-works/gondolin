[workspace]
# cargo-fuzz targets (nightly), see fuzz/README.md; vendored crates (patched
# dependencies, not linted as ours)
exclude = ["fuzz", "vendor/russh"]
resolver = "3"
members = [
    "crates/gondolin-wire",
    "crates/gondolin-proto",
    "crates/gondolin-vfs",
    "crates/gondolin-netstack",
    "crates/gondolin-egress",
    "crates/gondolin-sshproxy",
    "crates/gondolin-assets",
    "crates/gondolin-virtiofs",
    "crates/gondolind",
    "crates/gondolin-cli",
]

[workspace.package]
version = "0.14.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
gondolin-wire = { path = "crates/gondolin-wire" }
gondolin-proto = { path = "crates/gondolin-proto" }
gondolin-vfs = { path = "crates/gondolin-vfs" }
gondolin-netstack = { path = "crates/gondolin-netstack" }
gondolin-egress = { path = "crates/gondolin-egress" }
gondolin-sshproxy = { path = "crates/gondolin-sshproxy" }
gondolin-assets = { path = "crates/gondolin-assets" }
async-trait = "0.1"
bytes = "1"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[profile.release]
# fat LTO: the multi-call `gondolin` is 12% smaller than with thin LTO at the
# same throughput (opt-level "s" saves another 25% but costs ~20% HTTPS
# throughput, measured on the exec/net benchmarks)
lto = "fat"
codegen-units = 1
strip = "symbols"
# panics in per-flow/per-request work are contained (gondolind/src/panics.rs);
# the session task fails closed
panic = "unwind"

# Vendored, patched dependencies (see vendor/*/GONDOLIN-PATCHES.md).
[patch.crates-io]
russh = { path = "vendor/russh" }
