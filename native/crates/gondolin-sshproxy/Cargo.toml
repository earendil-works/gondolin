[package]
name = "gondolin-sshproxy"
description = "Exec-only SSH egress proxy for gondolind (guest-facing SSH server, upstream SSH client)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gondolin-netstack.workspace = true
gondolin-proto.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
base64 = "0.22"
ring = "0.17"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }

[dev-dependencies]
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }
