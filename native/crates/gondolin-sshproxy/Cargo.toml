[package]
name = "gondolin-sshproxy"
description = "Exec-only SSH egress proxy for gondolind (guest-facing SSH server, upstream SSH client)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gondolin-netstack.workspace = true
gondolin-proto.workspace = true
gondolin-log.workspace = true
tokio.workspace = true
gondolin-wire.workspace = true
ring = "0.17"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "process"] }
tempfile = "3"
