[workspace]
# cargo-fuzz targets (nightly), see fuzz/README.md
exclude = ["fuzz"]
resolver = "3"
members = [
    "crates/gondolin-log",
    "crates/gondolin-qcow2",
    "crates/gondolin-wire",
    "crates/gondolin-http",
    "crates/gondolin-proto",
    "crates/gondolin-vfs",
    "crates/gondolin-netstack",
    "crates/gondolin-egress",
    "crates/gondolin-hooks-djs",
    "crates/gondolin-sshproxy",
    "crates/gondolin-assets",
    "crates/gondolin-virtiofs",
    "crates/gondolind",
    "crates/gondolin-cli",
]

[workspace.package]
version = "0.14.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
gondolin-log = { path = "crates/gondolin-log" }
gondolin-qcow2 = { path = "crates/gondolin-qcow2" }
gondolin-wire = { path = "crates/gondolin-wire" }
gondolin-http = { path = "crates/gondolin-http" }
gondolin-proto = { path = "crates/gondolin-proto" }
gondolin-vfs = { path = "crates/gondolin-vfs" }
gondolin-netstack = { path = "crates/gondolin-netstack" }
gondolin-egress = { path = "crates/gondolin-egress" }
gondolin-sshproxy = { path = "crates/gondolin-sshproxy" }
gondolin-assets = { path = "crates/gondolin-assets" }
gondolin-hooks-djs = { path = "crates/gondolin-hooks-djs" }
bytes = "1"
# the minimal runtime (native/docs/runtime-without-tokio.md); crates add what
# they still need (`macros` only in dev-dependencies once select!/join! are gone)
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "sync", "io-util"] }

[profile.release]
# fat LTO: the multi-call `gondolin` is 12% smaller than with thin LTO at the
# same throughput (opt-level "s" saves another 25% but costs ~20% HTTPS
# throughput, measured on the exec/net benchmarks)
lto = "fat"
codegen-units = 1
strip = "symbols"
# panics in per-flow/per-request work are contained (gondolind/src/panics.rs);
# the session task fails closed
panic = "unwind"


# djs (tier-2 hooks) at opt-level 1 in debug builds: at 0 its interpreter runs
# several times slower (djs-embed's recommendation)
[profile.dev.package.djs-core]
opt-level = 1

[profile.dev.package.djs-libm]
opt-level = 1
