[package]
name = "gondolin-egress"
description = "HTTP/TLS mediation, policy and secret injection for gondolind"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gondolin-http.workspace = true
gondolin-log.workspace = true
gondolin-wire.workspace = true
gondolin-netstack.workspace = true
gondolin-proto.workspace = true
gondolin-sshproxy.workspace = true
bytes.workspace = true
tokio.workspace = true
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# guest side of the netstack integration test (netstack's smoltcp test harness)
smoltcp = { version = "0.14", default-features = false, features = [
    "std",
    "alloc",
    "medium-ethernet",
    "medium-ip",
    "proto-ipv4",
    "socket-tcp",
    "async",
] }

[[bench]]
name = "mitm_throughput"
harness = false
